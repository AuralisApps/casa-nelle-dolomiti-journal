const T={
en:['A week in the mountains. A lifetime of memories.','A mountain house with a story','Built in 1931, Casa nelle Dolomiti is a simple, rustic home in the quiet village of Grea di Cadore. Nearly a century of mountain life lives within its walls.','Simple stays, genuine hospitality','Comfortable rooms, shared facilities and a kitchen where guests can prepare their own meals. A practical home base for days spent outdoors.','Beyond the familiar trails','Turquoise lakes, waterfalls, mountain refuges and the limestone peaks of the Dolomites. Every day offers a different landscape.','Meet your local host','I live here and know the region through my own time spent hiking its trails. I can help you discover routes suited to your group and plan memorable days in the mountains.','Seven nights. Six days of discovery.','Stay together in Cadore and explore the mountains throughout the week. Routes and activities depend on the group, conditions and weather.','Your mountain week','7 nights of accommodation · 6 days of hiking experiences · For groups of 8–12 people','per person','Discover the hiking experience','Ask about availability','A quiet house. Extraordinary mountains.','Come for the trails. Stay for the stories.','A rustic home in the Dolomites','The Mountain Journal · 2027','Explore at your own pace','Shared spaces, a warm welcome and a place to rest after the trail.','Accommodation + hiking experience'],
it:['Una settimana in montagna. Ricordi per tutta la vita.','Una casa di montagna con una storia','Costruita nel 1931, Casa nelle Dolomiti è una casa semplice e rustica nel tranquillo borgo di Grea di Cadore. Tra le sue mura vive quasi un secolo di storia.','Soggiorni semplici, ospitalità autentica','Camere accoglienti, spazi condivisi e una cucina a disposizione degli ospiti. Una base pratica per giornate all’aria aperta.','Oltre i sentieri più conosciuti','Laghi turchesi, cascate, rifugi e cime calcaree delle Dolomiti. Ogni giorno offre un paesaggio diverso.','Conosci il tuo ospite locale','Vivo qui e conosco la zona grazie alle mie escursioni. Posso aiutarti a scoprire itinerari adatti al gruppo e organizzare belle giornate in montagna.','Sette notti. Sei giorni di scoperta.','Soggiornate insieme in Cadore ed esplorate la montagna durante la settimana. Itinerari e attività dipendono dal gruppo, dalle condizioni e dal meteo.','La tua settimana in montagna','7 notti di soggiorno · 6 giorni di escursioni · Gruppi da 8 a 12 persone','a persona','Scopri le escursioni','Chiedi disponibilità','Una casa tranquilla. Montagne straordinarie.','Vieni per i sentieri. Resta per i ricordi.','Una casa rustica nelle Dolomiti','The Mountain Journal · 2027','Esplora con i tuoi tempi','Spazi condivisi, una calorosa accoglienza e un posto dove riposare dopo il sentiero.','Soggiorno + escursioni'],
de:['Eine Woche in den Bergen. Erinnerungen fürs Leben.','Ein Berghaus mit Geschichte','Das 1931 erbaute Casa nelle Dolomiti ist ein einfaches, rustikales Haus im ruhigen Dorf Grea di Cadore. Seine Mauern erzählen fast ein Jahrhundert Berggeschichte.','Einfach wohnen, herzlich willkommen','Gemütliche Zimmer, Gemeinschaftsräume und eine Küche zur Selbstversorgung. Ein praktischer Ausgangspunkt für aktive Tage.','Abseits der bekannten Wege','Türkisfarbene Seen, Wasserfälle, Berghütten und die Kalksteingipfel der Dolomiten. Jeder Tag bringt neue Ausblicke.','Lerne deinen Gastgeber kennen','Ich lebe hier und kenne die Region von meinen eigenen Wanderungen. Ich helfe euch, passende Routen zu entdecken und schöne Tage in den Bergen zu planen.','Sieben Nächte. Sechs Tage voller Entdeckungen.','Wohnt gemeinsam in Cadore und erkundet die Berge während der Woche. Routen und Aktivitäten richten sich nach Gruppe, Bedingungen und Wetter.','Deine Bergwoche','7 Übernachtungen · 6 Wandertage · Für Gruppen von 8–12 Personen','pro Person','Wanderangebot entdecken','Verfügbarkeit anfragen','Ein ruhiges Haus. Außergewöhnliche Berge.','Komm wegen der Wege. Bleib wegen der Erinnerungen.','Ein rustikales Haus in den Dolomiten','The Mountain Journal · 2027','Entdecke in deinem Tempo','Gemeinschaftsräume, herzlicher Empfang und Erholung nach der Wanderung.','Unterkunft + Wandererlebnis'],
ro:['O săptămână la munte. Amintiri pentru o viață.','O casă de munte cu poveste','Construită în 1931, Casa nelle Dolomiti este o casă simplă și rustică în satul liniștit Grea di Cadore. Între zidurile ei se păstrează aproape un secol de viață la munte.','Cazare simplă, ospitalitate autentică','Camere primitoare, spații comune și o bucătărie unde oaspeții își pot pregăti mesele. O bază practică pentru zilele petrecute pe munte.','Dincolo de traseele cunoscute','Lacuri turcoaz, cascade, refugii și vârfuri spectaculoase. Fiecare zi poate aduce un peisaj diferit.','Cunoaște gazda locală','Locuiesc aici și cunosc zona din propriile mele drumeții. Te pot ajuta să descoperi trasee potrivite grupului și să planifici zile memorabile pe munte.','Șapte nopți. Șase zile de descoperiri.','Stați împreună în Cadore și explorați munții pe parcursul săptămânii. Traseele și activitățile depind de grup, condiții și vreme.','Săptămâna ta în Dolomiți','7 nopți de cazare · 6 zile de drumeții · Pentru grupuri de 8–12 persoane','de persoană','Descoperă pachetul de drumeții','Întreabă de disponibilitate','O casă liniștită. Munți extraordinari.','Vino pentru trasee. Rămâi pentru amintiri.','O casă rustică în Dolomiți','The Mountain Journal · 2027','Explorează în ritmul tău','Spații comune, primire călduroasă și un loc de odihnă după traseu.','Cazare + experiență de drumeție'],
fr:['Une semaine en montagne. Des souvenirs pour la vie.','Une maison de montagne chargée d’histoire','Construite en 1931, Casa nelle Dolomiti est une maison simple et rustique dans le village paisible de Grea di Cadore. Ses murs racontent près d’un siècle de vie en montagne.','Séjours simples, accueil authentique','Des chambres accueillantes, des espaces partagés et une cuisine pour préparer vos repas. Un pied-à-terre pratique pour profiter du plein air.','Au-delà des sentiers connus','Lacs turquoise, cascades, refuges et sommets calcaires des Dolomites. Chaque jour révèle un nouveau paysage.','Rencontrez votre hôte local','Je vis ici et connais la région grâce à mes randonnées. Je peux vous aider à découvrir des itinéraires adaptés au groupe et à préparer vos journées en montagne.','Sept nuits. Six jours de découvertes.','Séjournez ensemble dans le Cadore et explorez les montagnes toute la semaine. Les itinéraires dépendent du groupe, des conditions et de la météo.','Votre semaine en montagne','7 nuits d’hébergement · 6 jours de randonnée · Groupes de 8 à 12 personnes','par personne','Découvrir les randonnées','Demander les disponibilités','Une maison paisible. Des montagnes extraordinaires.','Venez pour les sentiers. Restez pour les souvenirs.','Une maison rustique dans les Dolomites','The Mountain Journal · 2027','Explorez à votre rythme','Espaces partagés, accueil chaleureux et repos après les sentiers.','Hébergement + randonnées'],
es:['Una semana en la montaña. Recuerdos para toda la vida.','Una casa de montaña con historia','Construida en 1931, Casa nelle Dolomiti es una casa sencilla y rústica en el tranquilo pueblo de Grea di Cadore. Sus muros guardan casi un siglo de historia.','Estancias sencillas, hospitalidad auténtica','Habitaciones acogedoras, espacios compartidos y una cocina donde preparar tus comidas. Una base práctica para disfrutar de la montaña.','Más allá de los senderos conocidos','Lagos turquesa, cascadas, refugios y cumbres de roca caliza. Cada día ofrece un paisaje diferente.','Conoce a tu anfitrión local','Vivo aquí y conozco la zona gracias a mis propias caminatas. Puedo ayudarte a descubrir rutas adecuadas para tu grupo y planificar días inolvidables.','Siete noches. Seis días de descubrimientos.','Alojaos juntos en Cadore y explorad las montañas durante la semana. Las rutas y actividades dependen del grupo, las condiciones y el tiempo.','Tu semana en la montaña','7 noches de alojamiento · 6 días de senderismo · Grupos de 8 a 12 personas','por persona','Descubre las rutas','Consulta disponibilidad','Una casa tranquila. Montañas extraordinarias.','Ven por los senderos. Quédate por los recuerdos.','Una casa rústica en los Dolomitas','The Mountain Journal · 2027','Explora a tu ritmo','Espacios compartidos, una cálida bienvenida y descanso después de caminar.','Alojamiento + senderismo']};

it:['Dove il giorno inizia nel silenzio.','Un colore indimenticabile.','Lascia che sia l’acqua a indicare la strada.','La natura, al suo ritmo.','Il tuo host locale e compagno di escursioni, per condividere avventure indimenticabili nelle Dolomiti.','Roccia, cielo e orizzonti infiniti.','Un panorama diverso a ogni curva.','Anche il viaggio fa parte della storia.','Un incontro inaspettato.','Spazio per respirare.','Alcuni luoghi non hanno bisogno di parole.','Ogni passo regala una nuova prospettiva.','Qui le montagne sembrano più vicine.','Un momento da ricordare.','I panorami più belli si condividono.'],
de:['Wo der Tag in Stille beginnt.','Eine Farbe, die bleibt.','Lass dich vom Wasser leiten.','Natur in ihrem eigenen Rhythmus.','Dein Gastgeber vor Ort und Wanderbegleiter – für unvergessliche Abenteuer in den Dolomiten.','Fels, Himmel und endlose Horizonte.','Hinter jeder Kurve ein neuer Blick.','Auch der Weg gehört zur Geschichte.','Eine unerwartete Begegnung.','Raum zum Durchatmen.','Manche Orte brauchen keine Worte.','Jeder Schritt eröffnet neue Perspektiven.','Hier wirken die Berge ganz nah.','Ein Moment, der bleibt.','Die schönsten Aussichten teilen wir.'],
fr:['Là où le jour commence en silence.','Une couleur inoubliable.','Laissez l’eau montrer le chemin.','La nature à son rythme.','Votre hôte local et compagnon de randonnée, pour partager des aventures inoubliables dans les Dolomites.','Pierre, ciel et horizons infinis.','Un nouveau paysage à chaque détour.','Le chemin fait aussi partie de l’histoire.','Une rencontre inattendue.','De l’espace pour respirer.','Certains lieux se passent de mots.','Chaque pas ouvre une autre perspective.','Ici, les montagnes semblent plus proches.','Un instant à garder.','Les plus belles vues se partagent.'],
es:['Donde el día comienza en silencio.','Un color inolvidable.','Deja que el agua marque el camino.','La naturaleza a su ritmo.','Tu anfitrión local y compañero de senderismo, compartiendo aventuras inolvidables en los Dolomitas.','Piedra, cielo y horizontes infinitos.','Una vista diferente tras cada curva.','El camino también es parte de la historia.','Un encuentro inesperado.','Espacio para respirar.','Hay lugares que no necesitan palabras.','Cada paso trae otra perspectiva.','Aquí las montañas parecen más cercanas.','Un momento para recordar.','Las mejores vistas se comparten.']};
const hiking='https://valdicadore.wixsite.com/casa-nelle-dolomiti/hiking-experiences';
const whatsapp='https://wa.me/?text='+encodeURIComponent('Hello! I would like to ask about the Casa nelle Dolomiti hiking week.');
let index=0,lang='en';const book=document.getElementById('book');const mobile=()=>window.matchMedia('(max-width:750px)').matches;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
// Each of the 15 supplied photos is referenced exactly once in this sequence.
const pages=[{kind:'cover',photo:0},{kind:'intro'},...Array.from({length:14},(_,i)=>({kind:'photo',photo:i+1})),{kind:'offer'},{kind:'closing'}];const total=pages.length;
const closing={en:['Until we meet in the mountains','The mountains will stay. The memories will travel with you.'],ro:['Până ne revedem la munte','Munții vor rămâne. Amintirile vor merge cu tine.'],it:['Ci vediamo in montagna','Le montagne resteranno. I ricordi vi accompagneranno.'],de:['Bis wir uns in den Bergen sehen','Die Berge bleiben. Die Erinnerungen begleiten dich.'],fr:['À bientôt dans les montagnes','Les montagnes resteront. Les souvenirs voyageront avec vous.'],es:['Hasta que nos veamos en las montañas','Las montañas permanecerán. Los recuerdos viajarán contigo.']};
function content(n){const p=pages[n],t=T[lang];if(!p)return '<div class="page"></div>';
if(p.kind==='cover')return `<div class="page cover"><img src="photos/${photos[p.photo]}" alt="Casa nelle Dolomiti" loading="eager"><div class="cover-content"><div class="eyebrow">GREA DI CADORE · ITALY</div><h1 class="title">Casa nelle<br>Dolomiti</h1><div class="sub">${esc(t[0])}</div></div></div>`;
if(p.kind==='photo')return `<div class="page gallery-page"><div class="gallery-photo"><img src="photos/${photos[p.photo]}" alt="Mountain experience photograph" loading="lazy"></div><div class="gallery-caption">${esc(lines[lang][p.photo])}</div></div>`;
if(p.kind==='intro')return `<div class="page"><div class="inner" style="justify-content:center"><div class="eyebrow">GREA DI CADORE · 1931</div><h2 class="title">${esc(t[1])}</h2><p class="body">${esc(t[2])}</p><h3 class="sub">${esc(t[3])}</h3><p class="body">${esc(t[4])}</p><div class="number">CASA NELLE DOLOMITI</div></div></div>`;
if(p.kind==='offer')return `<div class="page"><div class="inner" style="justify-content:center"><div class="eyebrow">${esc(t[20])}</div><h2 class="title">${esc(t[11])}</h2><p class="body">${esc(t[12])}</p><div class="price">680 €</div><div class="tag">${esc(t[13])}</div><div style="margin-top:25px"><a class="cta" href="${hiking}" target="_blank" rel="noopener">${esc(t[14])}</a><a class="cta secondary" href="${whatsapp}" target="_blank" rel="noopener">${esc(t[15])}</a></div></div></div>`;
const c=closing[lang];return `<div class="page"><div class="inner" style="justify-content:center;text-align:center;align-items:center"><div class="eyebrow">CASA NELLE DOLOMITI · 1931</div><h2 class="title">${esc(c[0])}</h2><p class="sub">${esc(c[1])}</p><div class="number">GREA DI CADORE · ITALY</div></div></div>`;}
function render(dir=0){const left=mobile()?index:Math.floor(index/2)*2;book.innerHTML=content(left)+(!mobile()?content(left+1):'');document.getElementById('counter').textContent=mobile()?`${index+1} / ${total}`:`${left+1}${left+1<total?'–'+(left+2):''} / ${total}`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=mobile()?index>=total-1:left+2>=total;if(dir){book.classList.remove('turn-next','turn-prev');void book.offsetWidth;book.classList.add(dir>0?'turn-next':'turn-prev');setTimeout(()=>book.classList.remove('turn-next','turn-prev'),500)}}
function move(d){const next=mobile()?index+d:Math.floor(index/2)*2+d*2;if(next<0||next>=total)return;index=next;render(d)}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('language').onchange=e=>{lang=e.target.value;document.documentElement.lang=lang;render()};window.addEventListener('resize',()=>{if(!mobile())index=Math.floor(index/2)*2;render()});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let sx=0;book.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX},{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>50)move(dx<0?1:-1)},{passive:true});render();
</script></body></html>
